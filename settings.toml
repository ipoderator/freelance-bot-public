# Настройки бота (несекретные). Секреты — только в .env (см. .env.example).
# После правки перезапустите бота.

[general]
# Часовой пояс для отображения времени в Telegram (в базе время хранится в UTC).
timezone = "Europe/Moscow"
# Проекты старше этого возраста (в часах) не присылаются; при первом запуске
# всё старше помечается как увиденное без уведомлений.
max_age_hours = 6
# Минимальный итоговый балл (0–100), чтобы проект пришёл в Telegram.
# 25 — по решению пользователя 2026-10-24 («можно понизить чуть релевантность»; раньше 30):
# в /last свежие сверху, отбирает пользователь сам.
min_score = 25
# true — ничего не отправлять на биржи (то же, что флаг --dry-run).
dry_run = false

[digest]
# Сам присылать новые заказы списком раз в час (решение пользователя 2026-10-24: «раз в час
# начиная с 11 утра»). Сбор идёт чаще (sources.*.interval_sec), находки копятся до дайджеста.
# false — каждая находка сразу отдельной карточкой с черновиком.
enabled = true
# Сетка дайджеста от start_hour:00 по general.timezone: 11:00, 12:00, 13:00, …
start_hour = 11
interval_min = 60

[storage]
# Файл SQLite: дедупликация, статусы проектов, история откликов.
db_path = "data/bot.sqlite3"

[scoring]
# Штраф к баллу за каждое требование к исполнителю, которое профиль не выполняет
# (стаж «от N лет», ИП/самозанятость, офис, обязательные отзывы).
requirement_penalty = 15

[offer]
# Цена (₽) и срок (дней) для подстановки в черновик. Пусто ("") — в тексте
# остаются метки [ЦЕНА] и [СРОК], и автоотправка невозможна.
price_rub = ""
days = ""

# ── Источники ────────────────────────────────────────────────────────────────
# enabled          — включён ли сбор с площадки;
# interval_sec     — интервал сбора в секундах (меньше 60 принудительно станет 60);
# jitter_sec       — случайная добавка к интервалу, чтобы не стучаться по часам;
# mode             — notify (только карточка) | draft (карточка + черновик) | auto (отправка);
#                    auto срабатывает только при всех условиях безопасности, иначе draft;
# daily_auto_limit — сколько откликов в сутки можно отправить автоматически (0 — ни одного);
# urls             — какие страницы читать (только первая страница, без пагинации).

[sources.fl]
enabled = true
interval_sec = 180
jitter_sec = 30
mode = "draft"
daily_auto_limit = 0
# true — присылать только проекты с бесплатным откликом (метка «для всех»; на FL нужна
# верификация аккаунта). Остальные отклики FL платные — от 80 ₽ за отклик без PRO
# (docs/platforms.md, §1): такие проекты отсекаются с причиной «платный отклик» и видны
# в /stats как отсечённые. false — присылать и их, с пометкой «💰 отклик платный».
# false — по решению пользователя 2026-10-22: платные отклики он покупает сам.
only_free_responses = false
# Официальный RSS FL.ru, фильтрующая форма /rss/all.xml?category=N (docs/platforms.md, §1.2).
# Адрес /rss/?subcategory=… подкатегорию игнорирует — его не используем.
#   5  — Программирование (Python, парсинг, чат-боты, API, скрипты)
#   31 — AI (агенты, LLM, нейросети)
#   41 — Автоматизация бизнеса (интеграции, n8n, боты для бизнеса)
#   34 — Мессенджеры (Telegram, боты)
# Каждая лента — отдельный запрос за цикл; проекты из разных лент дедуплицируются.
urls = [
    "https://www.fl.ru/rss/all.xml?category=5",
    "https://www.fl.ru/rss/all.xml?category=31",
    "https://www.fl.ru/rss/all.xml?category=41",
    "https://www.fl.ru/rss/all.xml?category=34",
]

[sources.kwork]
# ВЫКЛЮЧЕН по умолчанию. Пользовательское соглашение Kwork запрещает автоматический
# сбор данных с сервиса (docs/platforms.md, §2.2), поэтому включайте источник
# только осознанно и на свой риск: enabled = true. С включённым Kwork бот
# показывает предупреждение в /status и при запуске. Один запрос за цикл.
# Включён пользователем 2026-10-22 на свой риск.
enabled = true
interval_sec = 300
jitter_sec = 60
mode = "draft"
daily_auto_limit = 0
# Публичная биржа Kwork, рубрика «Разработка и IT» (c=11), только первая страница.
urls = [
    "https://kwork.ru/projects?c=11",
]

[kwork]
# Сколько коннектов Kwork бот может потратить за сутки. 0 — ни одного:
# автоотклики на Kwork не отправляются. Покупка коннектов/PRO ботом не делается никогда.
connects_daily_limit = 0

# ── Направления ──────────────────────────────────────────────────────────────
# weight   — вес направления при ранжировании;
# keywords — слова и синонимы (рус/англ), регистр не важен. Правило поиска
#            (freelance_bot/textmatch.py, то же для исключений):
#            • термин начинается с начала слова: «ии» не найдётся в «компании»;
#            • термин до 3 символов (у фразы — её последнее слово) должен совпасть
#              целым словом: «ios» не найдётся в «axios»;
#            • более длинный термин может быть началом слова: «парсинг» ловит
#              «парсинга», но и «агент» поймал бы «агентство» — поэтому для таких слов
#              перечислены точные формы («агенты», «агента»);
#            • слова фразы, кроме последнего, совпадают целиком.

[directions.backend]
weight = 1.0
keywords = [
    "python", "питон", "backend", "бэкенд", "бекенд", "back-end", "fastapi", "django",
    "flask", "aiohttp", "rest api", "api", "апи", "postgresql", "postgres", "sqlalchemy",
    "redis", "celery", "docker", "микросервис", "сервер", "серверная часть", "база данных",
    "webhook", "вебхук", "веб-сервис", "веб-сервиса", "web-сервис", "веб-платформ",
    "веб-приложени",
]

[directions.telegram]
weight = 1.0
keywords = [
    "telegram", "телеграм", "телеграмм", "tg-бот", "тг-бот", "тг бот", "тг бота", "тг боты",
    "тг", "tg", "чат-бот", "чат бот", "чат бота", "чат боты", "чат ботов", "чатбот", "бот для",
    "aiogram", "python-telegram-bot", "telethon", "pyrogram", "mini app", "мини-апп",
    "миниапп", "webapp",
]

[directions.ai_agents]
weight = 1.0
keywords = [
    "ai", "ии", "искусственный интеллект", "нейросеть", "нейросет", "llm", "gpt", "chatgpt",
    "openai", "claude", "anthropic", "gigachat", "yandexgpt", "langchain", "rag",
    "ai-агент", "ии-агент", "ai агент", "ии агент", "агенты", "агентов", "агента", "агентом",
    "агентами", "агентн", "agent", "промпт", "prompt", "ai-ассистент", "ии-ассистент",
    "ai ассистент", "виртуальный ассистент", "ai assistant", "ai-assistant",
]

[directions.automation]
weight = 1.0
keywords = [
    "автоматизац", "automation", "скрипт", "script", "интеграция с", "интеграцию с",
    "интеграции с", "интеграция api", "integration with", "api integration", "n8n",
    "make.com", "zapier", "crm", "amocrm", "битрикс24 api", "google sheets", "гугл таблиц",
    "excel", "выгрузк", "синхронизац", "cron", "по расписанию", "рутин",
]

[directions.parsing]
weight = 1.0
keywords = [
    "парсинг", "парсер", "спарсить", "parsing", "parser", "scraping", "scraper", "скрапинг",
    "сбор данных", "web scraping", "beautifulsoup", "bs4", "scrapy", "selenium", "playwright",
    "мониторинг цен", "выгрузка с сайта", "открытых источник", "сбор информации",
    "собрать данные", "собрать базу", "сбор базы", "собрать каталог", "сбор контактов",
    "собрать контакты",
]

# ── Пересечения направлений ──────────────────────────────────────────────────
# Проект, совпавший сразу с обоими направлениями пары, получает бонус к баллу.

[[intersections]]
directions = ["telegram", "backend"]
bonus = 15

[[intersections]]
directions = ["ai_agents", "backend"]
bonus = 15

[[intersections]]
directions = ["automation", "backend"]
bonus = 10

# ── Исключения ───────────────────────────────────────────────────────────────
# Если в проекте доминируют эти слова и нет сильного совпадения с профилем —
# проект отсекается с причиной (виден в /stats, но не присылается).
# Правило поиска слов — то же, что у направлений (см. выше).

[exclusions]
design = [
    "дизайн", "design", "figma", "фигма", "логотип", "баннер", "иллюстрац",
    "photoshop", "фотошоп", "ui/ux", "ux/ui", "макет", "верстка макета", "брендбук",
]
mobile = [
    "мобильное приложение", "мобильного приложения", "android", "андроид", "ios", "swift",
    "kotlin", "flutter", "react native", "xcode", "app store", "google play",
]
php = [
    "php", "wordpress", "вордпресс", "bitrix", "битрикс", "1с-битрикс", "laravel", "yii",
    "opencart", "joomla", "modx", "tilda", "тильда",
]
onec = [
    "1с", "1c", "1с:предприятие", "конфигурация 1с", "конфигурации 1с", "обработка 1с",
    "обработку 1с", "доработка 1с", "доработку 1с", "1с бухгалтер",
]
# Готовые генеративные сервисы контента (видео, изображения, озвучка, музыка). Проект,
# где AI — только работа в таком сервисе, без интеграции/API/backend/бота, отсекается как
# «вне профиля». Если в ТЗ есть API, бот, Python, интеграция — проект проходит как обычно.
