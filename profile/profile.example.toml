# Пример профиля — вымышленный разработчик, не реальный человек. Свой профиль создаёт
# мастер `python -m freelance_bot init` (пишет profile/profile.toml) или правьте этот файл.
#
# Профиль для черновиков откликов.
#
# confirmed_experience — ТОЛЬКО подтверждённый резюме опыт. У каждого факта:
#   id     — короткий английский идентификатор;
#   text   — как факт звучит в отклике;
#   tags   — направления (backend, telegram, ai_agents, automation, parsing), к которым он относится;
#   source — дословная строка из profile/resume_facts.txt (урезанный текст резюме).
# target_directions — где беру заказы. Это НЕ опыт: в откликах не утверждается,
#   что такие проекты уже выполнялись.

name = "Иван"

# Подтверждённый стаж разработки (1 год 10 месяцев): больший стаж в отклике — ложь.
experience_years = 1.8
# Telegram-ботов и AI-агентов в резюме нет: «делал ботов» в отклике запрещено.
built_bots_or_agents = false

target_directions = [
  "Backend на Python: API, сервисы, интеграции",
  "Telegram-боты",
  "AI-агенты и интеграции с LLM",
  "Автоматизация бизнес-процессов",
  "Парсинг и сбор данных",
]

# Дополнительные запрещённые утверждения (регулярные выражения, регистр не важен).
# Базовые правила — «5 лет Python», выполненные проекты с ботами/AI-агентами,
# личные данные — встроены в валидатор и действуют всегда.
forbidden_claims = [
  "(senior|сеньор|тимлид|team ?lead)",
  "(много|десятки|сотни)\\s+(успешных\\s+)?проектов",
  "(гарантирую|гарантия)\\s+(результат|100)",
]

[contacts]
# Личные данные в откликах выключены. Чтобы добавить контакт в подпись, впишите его
# ниже (например, telegram = "@ник") и поставьте include_in_responses = true.
include_in_responses = false

