    "elevenlabs", "stable diffusion", "leonardo", "dall-e", "kandinsky", "шедеврум", "veo",
    "seedance", "генерация видео", "генерации видео", "создание видео", "созданию видео",
    "ai-видео", "ии-видео", "нейровидео", "генерация изображений", "генерации изображений",
    "нейрофото", "озвучк", "озвучить", "видеоролик", "видеоклип", "видео для", "видео на",
    "изображени", "картинк", "аватар", "обложк", "песн", "музык", "голосовые", "reels", "рилс",
