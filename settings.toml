# Настройки бота (несекретные). Секреты — только в .env (см. .env.example).
# После правки перезапустите бота.

[general]
# Часовой пояс для отображения времени в Telegram (в базе время хранится в UTC).
timezone = "Europe/Moscow"
# Проекты старше этого возраста (в часах) не присылаются; при первом запуске
# всё старше помечается как увиденное без уведомлений. У площадки может быть свой срок —
# max_age_hours в её [sources.*] (вакансии SuperJob — 72 ч).
max_age_hours = 6
# Минимальный итоговый балл (0–100), чтобы проект пришёл в Telegram.
# 25 — по решению пользователя 2026-10-24 («можно понизить чуть релевантность»; раньше 30):
# в /last свежие сверху, отбирает пользователь сам.
min_score = 25
# true — ничего не отправлять на биржи (то же, что флаг --dry-run).
dry_run = false

[digest]
# Сам присылать новые заказы списком раз в час (решение пользователя 2026-10-24: «раз в час
# начиная с 11 утра»). Сбор идёт чаще (sources.*.interval_sec), находки копятся до дайджеста.
# false — каждая находка сразу отдельной карточкой с черновиком.
enabled = true
# Сетка дайджеста от start_hour:00 по general.timezone: 11:00, 12:00, 13:00, …
start_hour = 11
interval_min = 60

[public]
# Публичный бот (ADR 0011): /start от другого человека открывает анкету — согласие, ФИО,
# обращение, резюме → профиль, площадки. false — посторонним отказ, как раньше.
# Пока рассылка каждому не готова (этап 2), на сервере выключено; владелец может пройти
# анкету для проверки командой /signup.
enabled = false
# Площадки в анкете; «Везде» — все из списка. Kwork не предлагаем (решение 2026-10-24:
# «давай пока без kwork»), Work-zilla — сессия владельца, выключен.
platforms = ["fl", "freelance_ru", "work24", "hh", "superjob", "trudvsem", "tgchannels"]

[storage]
# Файл SQLite: дедупликация, статусы проектов, история откликов.
db_path = "data/bot.sqlite3"

[scoring]
# Штраф к баллу за каждое требование к исполнителю, которое профиль не выполняет
# (стаж «от N лет», ИП/самозанятость, офис, обязательные отзывы).
requirement_penalty = 15

[offer]
# Цена (₽) и срок (дней) для подстановки в черновик. Пусто ("") — в тексте
# остаются метки [ЦЕНА] и [СРОК], и автоотправка невозможна.
price_rub = ""
days = ""

# ── Источники ────────────────────────────────────────────────────────────────
# enabled          — включён ли сбор с площадки;
# interval_sec     — интервал сбора в секундах (меньше 60 принудительно станет 60);
# jitter_sec       — случайная добавка к интервалу, чтобы не стучаться по часам;
# mode             — notify (только карточка) | draft (карточка + черновик) | auto (отправка);
#                    auto срабатывает только при всех условиях безопасности, иначе draft;
# daily_auto_limit — сколько откликов в сутки можно отправить автоматически (0 — ни одного);
# urls             — какие страницы читать (только первая страница, без пагинации).

[sources.fl]
enabled = true
interval_sec = 180
jitter_sec = 30
mode = "draft"
daily_auto_limit = 0
# true — присылать только проекты с бесплатным откликом (метка «для всех»; на FL нужна
# верификация аккаунта). Остальные отклики FL платные — от 80 ₽ за отклик без PRO
# (docs/platforms.md, §1): такие проекты отсекаются с причиной «платный отклик» и видны
# в /stats как отсечённые. false — присылать и их, с пометкой «💰 отклик платный».
# false — по решению пользователя 2026-10-22: платные отклики он покупает сам.
only_free_responses = false
# Официальный RSS FL.ru, фильтрующая форма /rss/all.xml?category=N (docs/platforms.md, §1.2).
# Адрес /rss/?subcategory=… подкатегорию игнорирует — его не используем.
#   5  — Программирование (Python, парсинг, чат-боты, API, скрипты)
#   31 — AI (агенты, LLM, нейросети)
#   41 — Автоматизация бизнеса (интеграции, n8n, боты для бизнеса)
#   34 — Мессенджеры (Telegram, боты)
# Каждая лента — отдельный запрос за цикл; проекты из разных лент дедуплицируются.
urls = [
    "https://www.fl.ru/rss/all.xml?category=5",
    "https://www.fl.ru/rss/all.xml?category=31",
    "https://www.fl.ru/rss/all.xml?category=41",
    "https://www.fl.ru/rss/all.xml?category=34",
]

[sources.kwork]
# ВЫКЛЮЧЕН по умолчанию. Пользовательское соглашение Kwork запрещает автоматический
# сбор данных с сервиса (docs/platforms.md, §2.2), поэтому включайте источник
# только осознанно и на свой риск: enabled = true. С включённым Kwork бот
# показывает предупреждение в /status и при запуске. Один запрос за цикл.
# Включён пользователем 2026-10-22 на свой риск.
enabled = true
interval_sec = 300
jitter_sec = 60
mode = "draft"
daily_auto_limit = 0
# Публичная биржа Kwork, рубрика «Разработка и IT» (c=11), только первая страница.
urls = [
    "https://kwork.ru/projects?c=11",
]

[sources.work24]
# Work24 — готовые операции API Anything (freelance_bot/sources/work24.json, docs/platforms.md,
# §3): лента — JSON api.work24.ru, полное описание — публичная карточка заказа. Включён по
# просьбе пользователя 2026-10-24. api.work24.ru закрыт в robots.txt (Disallow: /), оферта
# автосбор прямо не запрещает (ADR 0008). Отклики на площадке бот не отправляет.
enabled = true
interval_sec = 600
jitter_sec = 60
mode = "draft"
daily_auto_limit = 0
# Ленты: "listItOrders" — раздел «Разработка и IT»; "listOrders" — все разделы (там в основном
# отзывы, дизайн и тексты — лишние запросы карточек). Карточка открывается один раз и только
# для нового открытого заказа моложе general.max_age_hours.
operations = ["listItOrders"]

[sources.freelance_ru]
# Freelance.ru — готовые операции API Anything (freelance_bot/sources/freelance-ru.json,
# docs/platforms.md, §5; ADR 0010): первая страница ленты freelance.ru/task (25 заданий всех
# разделов, около двух суток) и публичная карточка задания с полным текстом. Без входа и
# ключа. robots.txt закрывает адреса с ?page= — бот читает только /task. Задания «Только для
# Премиум» пропускаются: их полный текст без премиум-доступа закрыт. Карточка открывается один
# раз и только для нового публичного задания моложе general.max_age_hours (до 10 за цикл).
# Правила площадки запрещают автоматическую рассылку откликов (п. 5.10, 9.7) — бот их не
# отправляет. Контакты заказчика («Телеграм: @ник», t.me/…) из текста вырезаются. Включён по
# просьбе пользователя 2026-10-24.
enabled = true
interval_sec = 600
jitter_sec = 60
mode = "draft"
daily_auto_limit = 0
# Лента /task общая для всех разделов, поэтому бот берёт только задания этих разделов (как
# IT-рубрики RSS у FL); остальные карточки не открываются. [] — все разделы. Есть ещё:
# «Бизнес, Продажи и Консалтинг», «Маркетинг и Продвижение», «Тексты и Переводы», «Дизайн и
# Брендинг», «Фото и Контент», «Обучение и Наставничество» и др. (фильтр на freelance.ru/task).
categories = ["Веб-разработка и IT", "ИИ и Нейросети"]

[sources.workzilla]
# Work-zilla — операции API Anything (freelance_bot/sources/work-zilla.json, docs/platforms.md,
# §6; ADR 0010) с сессией вашего аккаунта исполнителя: WORKZILLA_COOKIE и WORKZILLA_AGENT_ID
# в .env (`python -m freelance_bot workzilla-session --from …/sessions/work-zilla.json`).
# Один запрос за цикл; задания разбираются, только если Work-zilla сообщает
# isStaticOrders = false. Пока обязательные шаги в кабинете не пройдены, лента
# демонстрационная (isStaticOrders = true, проверено 2026-10-24): бот ничего не сохраняет и
# не присылает, в /status — «лента демонстрационная». Выключен, пока доступ не откроется:
# настоящие задания вживую не проверялись. Отклики бот не отправляет.
enabled = false
interval_sec = 600
jitter_sec = 60
mode = "draft"
daily_auto_limit = 0

[sources.hh]
# HH.ru — вакансии из уведомлений автопоиска, которые бот hh.ru (@hh_rabota_bot, «Хэдди»)
# присылает вам в Telegram (ADR 0009, docs/platforms.md, §4). Сайт и API hh.ru бот не трогает:
# анонимный API закрыт (403), условия сайта запрещают автосбор (п. 6.1.38). Ваша сессия
# Telegram (`python -m freelance_bot hh-login`, ключи HH_TG_* в .env) читает только этот чат и
# ничего не отправляет. Откликов на вакансии бот не готовит и не отправляет.
# Включался 2026-10-24 («Хэдди в Telegram»); 2026-10-25 пользователь отключил сессию HH
# («я отключил его») — выключен. Включить снова: `hh-login`, затем true и деплой с --with-env.
enabled = false
interval_sec = 600
jitter_sec = 60
# notify — только карточка: черновик и цена со сроком для вакансий не нужны
mode = "notify"
daily_auto_limit = 0
chat = "hh_rabota_bot"

[sources.superjob]
# SuperJob — вакансии через официальный API (ADR 0012, docs/platforms.md, §7): ключ
# приложения SUPERJOB_API_KEY в .env, выдаёт https://api.superjob.ru/register/ после входа в
# аккаунт SuperJob. Без ключа источник выключен. Откликов на вакансии бот не готовит.
# Подключён по просьбе пользователя 2026-10-24 («подключи API SuperJob»); ключ вписан и
# источник включён 2026-10-25.
enabled = true
# Вакансии открыты дольше заказов: брать опубликованные за 3 дня, а не general.max_age_hours.
# По просьбе пользователя 2026-10-25 («разширь что бы бот брал вакансии до 3-х дней»).
max_age_hours = 72
interval_sec = 600
jitter_sec = 60
mode = "notify"
daily_auto_limit = 0
# Слова поиска: по запросу к API на слово за цикл (лимит API — 120 запросов в минуту).
queries = ["python", "fastapi", "парсинг", "telegram бот"]
# Разделы каталога (ключи из https://api.superjob.ru/2.0/catalogues/): 48 — «Разработка,
# программирование», 650 — «Нейросети / Искусственный интеллект». Пусто — все разделы.
catalogues = []
# true — только удалённая работа («на дому»)
remote_only = false

[sources.trudvsem]
# «Работа России» (trudvsem.ru) — вакансии из открытых данных портала, без ключа (ADR 0015,
# docs/platforms.md, §8). robots.txt API закрывает его от роботов — подключено решением
# пользователя 2026-10-25 («Добавить «Работа России»»). Ищет только под анкету: слова
# профессии и регион города из резюме; своих слов поиска у владельца нет.
enabled = true
max_age_hours = 72
interval_sec = 1800
jitter_sec = 60
mode = "notify"
daily_auto_limit = 0

[sources.tgchannels]
# Telegram-каналы с вакансиями — веб-превью t.me/s/<канал>, без аккаунта (ADR 0016,
# docs/platforms.md, §9). Условия Telegram сбор запрещают — подключено решением пользователя
# 2026-10-25 («Веб-превью t.me/s», «Только сеть 18 каналов»), риск на нём. Только под анкету:
# каналы города из резюме (все — если выбраны другие города); первая страница канала, тексты
# не уходят нейросети, контакты не копируются.
enabled = true
max_age_hours = 72
interval_sec = 1800
jitter_sec = 60
mode = "notify"
daily_auto_limit = 0

[sources.tgchannels.channels]
# Имя канала = город его вакансий. Новый канал — только того же формата: «Должность»,
# зарплата, «Обязанности:», «Требования:», «Контакты:» (проверено 2026-10-25).
rabota_moskva = "Москва"
vakansii_moskva = "Москва"
rabota_spb = "Санкт-Петербург"
vakansii_spb = "Санкт-Петербург"
rabota_piter = "Санкт-Петербург"
vakansii_kazan = "Казань"
rabota_krasnodar = "Краснодар"
rabota_rostov = "Ростов-на-Дону"
vakansii_samara = "Самара"
rabota_ufa = "Уфа"
vakansii_ufa = "Уфа"
rabota_perm = "Пермь"
vakansii_perm = "Пермь"
rabota_tyumen = "Тюмень"
rabota_omsk = "Омск"
vakansii_omsk = "Омск"
vakansii_sochi = "Сочи"
vakansii_smolensk = "Смоленск"

[kwork]
# Сколько коннектов Kwork бот может потратить за сутки. 0 — ни одного:
# автоотклики на Kwork не отправляются. Покупка коннектов/PRO ботом не делается никогда.
connects_daily_limit = 0

# ── Направления ──────────────────────────────────────────────────────────────
# weight   — вес направления при ранжировании;
# keywords — слова и синонимы (рус/англ), регистр не важен. Правило поиска
#            (freelance_bot/textmatch.py, то же для исключений):
#            • термин начинается с начала слова: «ии» не найдётся в «компании»;
#            • термин до 3 символов (у фразы — её последнее слово) должен совпасть
#              целым словом: «ios» не найдётся в «axios»;
#            • более длинный термин может быть началом слова: «парсинг» ловит
#              «парсинга», но и «агент» поймал бы «агентство» — поэтому для таких слов
#              перечислены точные формы («агенты», «агента»);
#            • слова фразы, кроме последнего, совпадают целиком.

[directions.backend]
weight = 1.0
keywords = [
    "python", "питон", "backend", "бэкенд", "бекенд", "back-end", "fastapi", "django",
    "flask", "aiohttp", "rest api", "api", "апи", "postgresql", "postgres", "sqlalchemy",
    "redis", "celery", "docker", "микросервис", "сервер", "серверная часть", "база данных",
    "webhook", "вебхук", "веб-сервис", "веб-сервиса", "web-сервис", "веб-платформ",
    "веб-приложени",
]

[directions.telegram]
weight = 1.0
keywords = [
    "telegram", "телеграм", "телеграмм", "tg-бот", "тг-бот", "тг бот", "тг бота", "тг боты",
    "тг", "tg", "чат-бот", "чат бот", "чат бота", "чат боты", "чат ботов", "чатбот", "бот для",
    "aiogram", "python-telegram-bot", "telethon", "pyrogram", "mini app", "мини-апп",
    "миниапп", "webapp",
]

[directions.ai_agents]
weight = 1.0
keywords = [
    "ai", "ии", "искусственный интеллект", "нейросеть", "нейросет", "llm", "gpt", "chatgpt",
    "openai", "claude", "anthropic", "gigachat", "yandexgpt", "langchain", "rag",
    "ai-агент", "ии-агент", "ai агент", "ии агент", "агенты", "агентов", "агента", "агентом",
    "агентами", "агентн", "agent", "промпт", "prompt", "ai-ассистент", "ии-ассистент",
    "ai ассистент", "виртуальный ассистент", "ai assistant", "ai-assistant",
]

[directions.automation]
weight = 1.0
keywords = [
    "автоматизац", "automation", "скрипт", "script", "интеграция с", "интеграцию с",
    "интеграции с", "интеграция api", "integration with", "api integration", "n8n",
    "make.com", "zapier", "crm", "amocrm", "битрикс24 api", "google sheets", "гугл таблиц",
    "excel", "выгрузк", "синхронизац", "cron", "по расписанию", "рутин",
]

[directions.parsing]
weight = 1.0
keywords = [
    "парсинг", "парсер", "спарсить", "parsing", "parser", "scraping", "scraper", "скрапинг",
    "сбор данных", "web scraping", "beautifulsoup", "bs4", "scrapy", "selenium", "playwright",
    "мониторинг цен", "выгрузка с сайта", "открытых источник", "сбор информации",
    "собрать данные", "собрать базу", "сбор базы", "собрать каталог", "сбор контактов",
    "собрать контакты",
]

# ── Пересечения направлений ──────────────────────────────────────────────────
# Проект, совпавший сразу с обоими направлениями пары, получает бонус к баллу.

[[intersections]]
directions = ["telegram", "backend"]
bonus = 15

[[intersections]]
directions = ["ai_agents", "backend"]
bonus = 15

[[intersections]]
directions = ["automation", "backend"]
bonus = 10

# ── Исключения ───────────────────────────────────────────────────────────────
# Если в проекте доминируют эти слова и нет сильного совпадения с профилем —
# проект отсекается с причиной (виден в /stats, но не присылается).
# Правило поиска слов — то же, что у направлений (см. выше).

[exclusions]
design = [
    "дизайн", "design", "figma", "фигма", "логотип", "баннер", "иллюстрац",
    "photoshop", "фотошоп", "ui/ux", "ux/ui", "макет", "верстка макета", "брендбук",
]
mobile = [
    "мобильное приложение", "мобильного приложения", "android", "андроид", "ios", "swift",
    "kotlin", "flutter", "react native", "xcode", "app store", "google play",
]
php = [
    "php", "wordpress", "вордпресс", "bitrix", "битрикс", "1с-битрикс", "laravel", "yii",
    "opencart", "joomla", "modx", "tilda", "тильда",
]
onec = [
    "1с", "1c", "1с:предприятие", "конфигурация 1с", "конфигурации 1с", "обработка 1с",
    "обработку 1с", "доработка 1с", "доработку 1с", "1с бухгалтер",
]
# Готовые генеративные сервисы контента (видео, изображения, озвучка, музыка). Проект,
# где AI — только работа в таком сервисе, без интеграции/API/backend/бота, отсекается как
# «вне профиля». Если в ТЗ есть API, бот, Python, интеграция — проект проходит как обычно.
ai_content = [
    "higgsfield", "midjourney", "runway", "kling", "suno", "udio", "sora", "pika", "heygen",
    "elevenlabs", "stable diffusion", "leonardo", "dall-e", "kandinsky", "шедеврум", "veo",
    "seedance", "генерация видео", "генерации видео", "создание видео", "созданию видео",
    "ai-видео", "ии-видео", "нейровидео", "генерация изображений", "генерации изображений",
    "нейрофото", "озвучк", "озвучить", "видеоролик", "видеоклип", "видео для", "видео на",
    "изображени", "картинк", "аватар", "обложк", "песн", "музык", "голосовые", "reels", "рилс",
]
# Маркетинг и SMM: «телеграм» в «смм-стратегии для телеграм-канала» — канал, а не бот.
marketing = [
    "смм", "smm", "таргет", "таргетолог", "маркетолог", "контент-план", "seo", "продвижение",
